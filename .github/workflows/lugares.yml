name: Actualizar lugares
# Descarga los mapas de OpenStreetMap (Geofabrik), saca las áreas, vaciados, agua y parkings
# de cada país a la vez, y los guarda juntos en data/places.
# Para actualizarlos: pestaña Actions > "Actualizar lugares" > "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_places.py', '.github/workflows/lugares.yml']
permissions:
  contents: write
concurrency:
  group: lugares
  cancel-in-progress: true
jobs:
  pais:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: [spain, portugal, andorra, france, monaco, italy, switzerland, austria, germany,
                 belgium, luxembourg, netherlands, slovenia, croatia, greece, great-britain,
                 ireland-and-northern-ireland, denmark]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Sacar lugares de ${{ matrix.region }}
        run: python3 scripts/build_places.py extract ${{ matrix.region }} ${{ runner.temp }}/${{ matrix.region }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: lugares-${{ matrix.region }}
          path: ${{ runner.temp }}/${{ matrix.region }}.json
          retention-days: 3
  juntar:
    needs: pais
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lugares-*
          merge-multiple: true
          path: ${{ runner.temp }}/paises
      - name: Juntar en trocitos
        run: python3 scripts/build_places.py merge ${{ runner.temp }}/paises
      - name: Guardar
        run: |
          git config user.name "etxeleku-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          git diff --cached --quiet || (git commit -m "Actualizar lugares (OpenStreetMap)" && git pull --rebase && git push)
