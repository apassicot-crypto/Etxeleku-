name: Actualizar lugares
# Descarga los mapas de OpenStreetMap (Geofabrik) y saca las áreas, vaciados, agua y parkings de Europa y los guarda en data/places.
# Para actualizarlos: pestaña Actions > "Actualizar lugares" > "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_places.py', '.github/workflows/lugares.yml']
permissions:
  contents: write
concurrency:
  group: lugares
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Instalar osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Descargar lugares de Europa
        run: python3 scripts/build_places.py
      - name: Guardar
        run: |
          git config user.name "etxeleku-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          git diff --cached --quiet || (git commit -m "Actualizar lugares (OpenStreetMap)" && git pull --rebase && git push)
